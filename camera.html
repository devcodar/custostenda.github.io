<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-detection"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
video,canvas{position:absolute;width:100%;height:100%;object-fit:cover}
#ui{position:fixed;bottom:0;width:100%;background:#111;padding:10px}
button,select{padding:8px;margin:5px}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="ui">
<select id="cameraSelect"></select>
<button onclick="startCamera()">Iniciar</button>
<button onclick="stopCamera()">Parar</button>
<button onclick="toggleFlash()">Flash</button>
</div>

<script>
let video=document.getElementById('video')
let canvas=document.getElementById('canvas')
let ctx=canvas.getContext('2d')
let stream
let track
let detector
let last=0

async function loadDetector(){
const model=faceDetection.SupportedModels.MediaPipeFaceDetector
detector=await faceDetection.createDetector(model,{runtime:'tfjs',maxFaces:1})
}

async function getCameras(){
const devices=await navigator.mediaDevices.enumerateDevices()
const cams=devices.filter(d=>d.kind==='videoinput')
let select=document.getElementById("cameraSelect")
select.innerHTML=""
cams.forEach(c=>{
let option=document.createElement("option")
option.value=c.deviceId
option.text=c.label||"Camera"
select.appendChild(option)
})
}

async function startCamera(){
if(stream)stopCamera()

await loadDetector()

let id=document.getElementById("cameraSelect").value

stream=await navigator.mediaDevices.getUserMedia({
video:{deviceId:id?{exact:id}:undefined}
})

video.srcObject=stream
track=stream.getVideoTracks()[0]
detectLoop()
}

function stopCamera(){
if(stream){
stream.getTracks().forEach(t=>t.stop())
}
}

async function toggleFlash(){
try{
await track.applyConstraints({advanced:[{torch:true}]})
setTimeout(()=>track.applyConstraints({advanced:[{torch:false}]}),200)
}catch(e){}
}

function beep(){
let ctxAudio=new AudioContext()
let osc=ctxAudio.createOscillator()
osc.connect(ctxAudio.destination)
osc.start()
osc.stop(ctxAudio.currentTime+0.1)
}

async function detectLoop(){
canvas.width=video.videoWidth
canvas.height=video.videoHeight
let faces=await detector.estimateFaces(video)

ctx.clearRect(0,0,canvas.width,canvas.height)

if(faces.length>0){
let f=faces[0]
ctx.strokeStyle="lime"
ctx.lineWidth=3
ctx.strokeRect(f.box.xMin,f.box.yMin,f.box.width,f.box.height)

let cx=f.box.xMin+f.box.width/2
let cy=f.box.yMin+f.box.height/2

let centerX=canvas.width/2
let centerY=canvas.height/2

let dx=Math.abs(cx-centerX)
let dy=Math.abs(cy-centerY)

if(dx<100 && dy<100){
if(Date.now()-last>3000){
last=Date.now()

let snap=document.createElement("canvas")
snap.width=canvas.width
snap.height=canvas.height
snap.getContext("2d").drawImage(video,0,0)
snap.toBlob(b=>console.log("Foto capturada"))

beep()
navigator.vibrate(200)
toggleFlash()
}
}
}

requestAnimationFrame(detectLoop)
}

getCameras()
</script>

</body>
</html>
